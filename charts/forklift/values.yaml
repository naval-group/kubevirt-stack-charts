global:
  imageRegistry: ""
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []

namespace: konveyor-forklift
version: release-2.12

operator:
  image:
    repository: quay.io/kubev2v/forklift-operator
  replicas: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  priorityClassName: ""

## ForkliftController CR settings.
cr:
  ## Resource requests/limits for components deployed by forklift-operator.
  ## Empty = operator defaults. Rendered as <component>_container_<requests|limits>_<cpu|memory>
  ## fields of the ForkliftController spec.
  ## Example:
  ##   controller:
  ##     requests: {cpu: 100m, memory: 350Mi}
  ##     limits: {cpu: "1", memory: 1Gi}
  componentResources:
    ## forklift-controller "main" container
    controller: {}
    ## forklift-controller "inventory" container
    inventory: {}
    api: {}
    validation: {}
    ovaProxy: {}
    ## Populator pods spawned during migrations. The forklift-volume-populator-controller
    ## Deployment itself has no resources setting upstream.
    populator: {}
    ## Migration pods
    virtV2v: {}
    hooks: {}
    ## Provider servers
    ova: {}
    hyperv: {}
    ## Optional UI components
    cliDownload: {}
    uiPlugin: {}
    mcpServer: {}

## Trusted CA bundle for Forklift Provider connections.
## If your source clusters use certificates signed by a corporate CA,
## provide the PEM-encoded CA bundle here. A ConfigMap will be created
## that you can reference when creating Provider secrets.
##
## Example:
##   trustedCA: |
##     -----BEGIN CERTIFICATE-----
##     MIIBxTCCAWugAwIBAgI...
##     -----END CERTIFICATE-----
trustedCA: ""

## Inventory proxy — exposes the forklift-inventory API via the k8s API
## service proxy. Required on vanilla Kubernetes where kubeconfigs use
## client certificates (RKE2, kubeadm) instead of bearer tokens.
## The proxy injects a forklift-controller SA token so that
## forklift-inventory accepts the request.
## Without this, tools like Headlamp cannot access the inventory API.
inventoryProxy:
  enabled: true
  image:
    repository: openresty/openresty
    tag: 1.31.1.1-1-alpine-fat
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi
  priorityClassName: ""
