global:
  imageRegistry: ""
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []

## RKE2 mode — if your cluster is RKE2, Multus is already installed.
## This deploys a HelmChartConfig to configure it (thick plugin + DNC).
## When enabled, all standalone Multus resources are skipped.
rke2:
  enabled: false
  ## CRI socket path (RKE2 uses /run/k3s/containerd/containerd.sock)
  criSocket: /run/k3s/containerd/containerd.sock
  multusSocket: /run/multus/multus.sock

## Standalone Multus deployment (ignored when rke2.enabled=true)
namespace: kube-system
thick: true
cniVersion: "0.3.1"

image:
  repository: ghcr.io/k8snetworkplumbingwg/multus-cni
  tag: v4.1.4

## Resources for the multus container (thick or thin).
## Not applied in RKE2 mode: rke2-multus gates multus and DNC resources behind a
## single pod.resources.enabled flag, and its DNC template mis-indents them
## (rejected by strict validation), so they are not passed through.
resources:
  requests:
    cpu: 10m
    memory: 50Mi

## Thin plugin only (thick=false): install-multus-binary init container
initContainer:
  resources:
    requests:
      cpu: 10m
      memory: 15Mi

tolerations:
  - operator: Exists

priorityClassName: system-node-critical

dynamicNetworks:
  enabled: true
  image:
    repository: ghcr.io/k8snetworkplumbingwg/multus-dynamic-networks-controller
    tag: v0.3.7
  criSocket: /run/containerd/containerd.sock
  multusSocket: /run/multus/multus.sock
  resources:
    requests:
      cpu: 100m
      memory: 50Mi
  priorityClassName: system-node-critical
