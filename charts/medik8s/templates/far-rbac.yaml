{{- if .Values.far.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fence-agents-remediation-manager
  labels:
    app.kubernetes.io/name: fence-agents-remediation-operator
    {{- include "kubevirt-stack.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - delete
      - get
      - list
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - delete
      - deletecollection
      - get
      - list
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
  - apiGroups:
      - fence-agents-remediation.medik8s.io
    resources:
      - fenceagentsremediations
      - fenceagentsremediationtemplates
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - fence-agents-remediation.medik8s.io
    resources:
      - fenceagentsremediations/finalizers
      - fenceagentsremediationtemplates/finalizers
    verbs:
      - update
  - apiGroups:
      - fence-agents-remediation.medik8s.io
    resources:
      - fenceagentsremediations/status
      - fenceagentsremediationtemplates/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - storage.k8s.io
    resources:
      - volumeattachments
    verbs:
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fence-agents-remediation-manager
  labels:
    app.kubernetes.io/name: fence-agents-remediation-operator
    {{- include "kubevirt-stack.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fence-agents-remediation-manager
subjects:
  - kind: ServiceAccount
    name: fence-agents-remediation-controller-manager
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fence-agents-remediation-ext-remediation
  labels:
    app.kubernetes.io/name: fence-agents-remediation-operator
    rbac.ext-remediation/aggregate-to-ext-remediation: "true"
    {{- include "kubevirt-stack.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - fence-agents-remediation.medik8s.io
    resources:
      - fenceagentsremediationtemplates
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - fence-agents-remediation.medik8s.io
    resources:
      - fenceagentsremediations
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fence-agents-remediation-leader-election
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: fence-agents-remediation-operator
    {{- include "kubevirt-stack.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fence-agents-remediation-leader-election
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: fence-agents-remediation-operator
    {{- include "kubevirt-stack.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fence-agents-remediation-leader-election
subjects:
  - kind: ServiceAccount
    name: fence-agents-remediation-controller-manager
    namespace: {{ .Values.namespace }}
{{- end }}
