global:
  imageRegistry: ""
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []

## Defaults to global.kubevirtNamespace
namespace: ""
version: v1.8.4

operator:
  replicas: 2
  image:
    repository: quay.io/kubevirt/virt-operator
  resources:
    requests:
      cpu: 10m
      memory: 450Mi
  nodeSelector: {}
  tolerations: []
  priorityClassName: kubevirt-cluster-critical

## virt-exportproxy is always deployed by KubeVirt (VMExport feature gate).
## externalMode creates an Ingress + TLS cert so VMExport external links
## are populated — required for Forklift cross-cluster cold migration.
##
## Requirements:
##   - An Ingress controller with backend HTTPS support (e.g. ingress-nginx)
##   - cert-manager (for automatic TLS cert generation)
exportProxy:
  externalMode:
    enabled: false
    ## FQDN for the export proxy (must be resolvable from remote clusters)
    hostname: ""
    ## Ingress class name (e.g. nginx)
    ingressClassName: ""
    ## cert-manager issuer reference. If empty, a self-signed Issuer is created.
    ## Example for an existing ClusterIssuer:
    ##   issuerRef:
    ##     name: letsencrypt-prod
    ##     kind: ClusterIssuer
    certManager:
      issuerRef: {}

cr:
  configuration:
    developerConfiguration:
      featureGates: []
      ## Use software emulation for VMs (no /dev/kvm required).
      ## Useful for development and CI environments without nested virt.
      useEmulation: false
    network: {}
    migrations: {}
    liveUpdateConfiguration: {}
    evictionStrategy: ""
    permittedHostDevices: {}
    ## Seccomp profile for virt-launcher pods.
    ## Example (kubevirt/kubevirt.json is the profile virt-handler installs on nodes):
    ##   seccompConfiguration:
    ##     virtualMachineInstanceProfile:
    ##       customProfile:
    ##         localhostProfile: kubevirt/kubevirt.json
    ## or:
    ##   seccompConfiguration:
    ##     virtualMachineInstanceProfile:
    ##       customProfile:
    ##         runtimeDefaultProfile: true
    seccompConfiguration: {}
    ## Mediated devices configuration for vGPU passthrough.
    ## Example:
    ##   mediatedDevicesConfiguration:
    ##     mediatedDeviceTypes:
    ##       - nvidia-222
    ##       - nvidia-228
    ##     nodeMediatedDeviceTypes:
    ##       - nodeSelector:
    ##           feature.node.kubernetes.io/pci-10de.present: "true"
    ##         mediatedDeviceTypes:
    ##           - nvidia-222
    mediatedDevicesConfiguration: {}
    ## Resources for helper containers KubeVirt adds to VM-related pods
    ## (spec.configuration.supportContainerResources). Empty = KubeVirt defaults.
    ## Example:
    ##   containerDisk:
    ##     requests: {cpu: 1m, memory: 1M}
    ##     limits: {cpu: 10m, memory: 40M}
    supportContainerResources:
      ## Container disk containers in virt-launcher pods: volume<name>,
      ## volume<name>-init and the container-disk-binary init container
      containerDisk: {}
      ## Hotplug attachment pods (hp-volume-*)
      hotplugDisk: {}
      ## virtiofs filesystem containers
      virtiofs: {}
      ## Hook sidecar containers
      sidecar: {}
      ## VM export server pods
      vmExport: {}
      ## guest-console-log container in virt-launcher pods
      guestConsoleLog: {}
  imagePullPolicy: IfNotPresent
  ## Resource requests/limits for components deployed by virt-operator.
  ## Empty = operator defaults. Each entry is rendered as a strategic-merge
  ## patch in customizeComponents.patches (appended to any patches below).
  ## Example:
  ##   virtHandler:
  ##     requests: {cpu: 10m, memory: 325Mi}
  ##     limits: {memory: 1Gi}
  componentResources:
    virtApi: {}
    virtController: {}
    virtHandler: {}
    ## virt-launcher init container of the virt-handler DaemonSet
    virtHandlerInit: {}
    ## pr-helper container of the virt-handler DaemonSet (no upstream defaults).
    ## Only applied when the PersistentReservation feature gate is enabled.
    virtHandlerPrHelper: {}
    virtExportProxy: {}
    ## Only deployed with the DecentralizedLiveMigration feature gate
    virtSynchronizationController: {}
    ## Only deployed with the Template feature gate
    virtTemplateApiserver: {}
    virtTemplateController: {}
  ## Raw KubeVirt customizeComponents (patches / flags).
  ## See https://kubevirt.io/user-guide/cluster_admin/customize_components/
  customizeComponents: {}
  monitorNamespace: ""
  monitorAccount: ""
  workloadUpdateStrategy: {}
  certificateRotateStrategy: {}
