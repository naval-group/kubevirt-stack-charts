name: Lint & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v4.2.0

      - name: Lint all charts
        run: |
          for chart in charts/*/; do
            echo "=== Linting $(basename $chart) ==="
            helm lint "$chart" || exit 1
          done

      - name: Template all charts (standalone)
        run: |
          for chart in charts/*/; do
            name=$(basename "$chart")
            echo "=== Templating $name ==="
            helm template test "$chart" \
              --kube-version 1.30.0 \
              --api-versions cert-manager.io/v1 \
              --api-versions monitoring.coreos.com/v1 \
              > /dev/null || exit 1
          done

      - name: Validate schemas
        run: |
          for schema in charts/*/values.schema.json; do
            echo "=== Validating $(dirname $schema | xargs basename) schema ==="
            python3 -c "import json; json.load(open('$schema')); print('  Valid JSON')"
          done
